services:
  mongodb:
    image: mongo:4.4-bionic
    container_name: mongodb
    restart: always
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
      - MONGODB_DATABASE=tanner
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    volumes:
      - ./.data/db:/data/db
    ports:
      - '27017:27017'

volumes:
  mongodb_data:
    driver: local